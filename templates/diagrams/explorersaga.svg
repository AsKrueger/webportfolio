    <path class="dg-line" d="M600 92H624" marker-end="url(#dg-arrow-es)"/>
    <path class="dg-line" d="M660 124L594 166" marker-end="url(#dg-arrow-es)"/>
    <path class="dg-line" d="M710 124V164" marker-end="url(#dg-arrow-es)"/>
