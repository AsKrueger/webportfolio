    <text class="dg-t" x="454" y="196">JPA adapters</text>
    <text class="dg-s" x="454" y="216">port.out</text>

    <rect class="dg-box" x="630" y="170" width="160" height="64" rx="10"/>
    <text class="dg-t" x="644" y="196">OverpassAdapter</text>
    <text class="dg-s" x="644" y="216">TourismDataProvider</text>

    <rect class="dg-box" x="440" y="306" width="160" height="64" rx="10"/>
    <text class="dg-t" x="454" y="332">PostgreSQL 15</text>
    <text class="dg-s" x="454" y="352">Flyway</text>

    <rect class="dg-ext" x="630" y="306" width="160" height="64" rx="10"/>
