<svg class="dg" viewBox="0 0 820 400" role="img" aria-label="{{ t.diagram.explorer_label }}" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="dg-arrow-es" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="dg-head" d="M0 0L10 5L0 10z"/>
        </marker>
    </defs>

    <!-- Fábrica de datos -->
    <rect class="dg-group" x="10" y="20" width="250" height="330" rx="14"/>
    <text class="dg-label" x="26" y="44">Python 3.12 · datafactory</text>

    <rect class="dg-ext" x="30" y="60" width="210" height="76" rx="10"/>
    <text class="dg-t" x="44" y="84">{{ t.diagram.open_data }}</text>
    <text class="dg-s" x="44" y="104">OSM · Wikidata · Wikipedia</text>
    <text class="dg-s" x="44" y="122">Commons · Junta de Extremadura</text>

    <rect class="dg-box" x="30" y="170" width="210" height="60" rx="10"/>
    <text class="dg-t" x="44" y="194">factory.py</text>
    <text class="dg-s" x="44" y="214">{{ t.diagram.reproducible }}</text>

    <rect class="dg-core-box" x="30" y="264" width="210" height="64" rx="10"/>
    <text class="dg-t dg-t-accent" x="44" y="290">pack.json.gz</text>
    <text class="dg-s" x="44" y="310">manifest.json · sha256</text>

    <path class="dg-line" d="M135 136V164" marker-end="url(#dg-arrow-es)"/>
    <path class="dg-line" d="M135 230V258" marker-end="url(#dg-arrow-es)"/>

    <!-- Publicación -->
    <rect class="dg-ext" x="300" y="264" width="160" height="64" rx="10"/>
    <text class="dg-t" x="314" y="290">GitHub Release</text>
    <text class="dg-s" x="314" y="310">content-pack</text>
    <path class="dg-line" d="M240 296H294" marker-end="url(#dg-arrow-es)"/>
    <text class="dg-s dg-s-accent" x="380" y="350" text-anchor="middle">{{ t.diagram.verify }}</text>

    <!-- App Android -->
    <rect class="dg-group" x="500" y="20" width="310" height="366" rx="14"/>
    <text class="dg-label" x="516" y="44">Android · Kotlin</text>

    <rect class="dg-box" x="520" y="60" width="270" height="56" rx="10"/>
    <text class="dg-t" x="534" y="84">Compose UI</text>
    <text class="dg-s" x="534" y="103">Material 3 · MapLibre offline</text>

    <rect class="dg-box" x="520" y="140" width="270" height="56" rx="10"/>
    <text class="dg-t" x="534" y="164">ViewModels</text>
    <text class="dg-s" x="534" y="183">StateFlow · ES / EN</text>

    <rect class="dg-box" x="520" y="220" width="270" height="56" rx="10"/>
    <text class="dg-t" x="534" y="244">Room + FTS4</text>
    <text class="dg-s" x="534" y="263">{{ t.diagram.room }}</text>

    <rect class="dg-core-box" x="520" y="300" width="270" height="64" rx="10"/>
    <text class="dg-t dg-t-accent" x="534" y="326">ContentRepository</text>
    <text class="dg-s" x="534" y="346">{{ t.diagram.worker }}</text>

    <path class="dg-line" d="M655 116V134" marker-end="url(#dg-arrow-es)"/>
    <path class="dg-line" d="M655 196V214" marker-end="url(#dg-arrow-es)"/>
    <path class="dg-line" d="M655 300V282" marker-end="url(#dg-arrow-es)"/>
    <path class="dg-line" d="M460 296H486V332H514" marker-end="url(#dg-arrow-es)"/>

    <path class="dg-line dg-line-dashed" d="M135 328V378H560V370" marker-end="url(#dg-arrow-es)"/>
    <text class="dg-s" x="148" y="370">{{ t.diagram.bundled }}</text>
</svg>
