<svg class="dg" viewBox="0 0 820 400" role="img" aria-label="{{ t.diagram.cost_label }}" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="dg-arrow-3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="dg-head" d="M0 0L10 5L0 10z"/>
        </marker>
    </defs>

    <!-- App Android: todo en el dispositivo -->
    <rect class="dg-group" x="10" y="20" width="560" height="362" rx="14"/>
    <text class="dg-label" x="26" y="42">{{ t.diagram.cost_group }}</text>

    <rect class="dg-box" x="30" y="56" width="250" height="56" rx="10"/>
    <text class="dg-t" x="44" y="80">Compose UI</text>
    <text class="dg-s" x="44" y="99">{{ t.diagram.cost_ui }}</text>

    <rect class="dg-box" x="300" y="56" width="250" height="56" rx="10"/>
    <text class="dg-t" x="314" y="80">ViewModels</text>
    <text class="dg-s" x="314" y="99">StateFlow</text>

    <rect class="dg-core-box" x="30" y="146" width="250" height="76" rx="10"/>
    <text class="dg-t dg-t-accent" x="44" y="172">CostEngine</text>
    <text class="dg-s" x="44" y="192">{{ t.diagram.pure_kotlin }}</text>
    <text class="dg-s" x="44" y="208">scale 8 → 4 · HALF_UP</text>

    <rect class="dg-box" x="300" y="146" width="250" height="56" rx="10"/>
    <text class="dg-t" x="314" y="170">Repository</text>
    <text class="dg-s" x="314" y="189">{{ t.diagram.cost_repo }}</text>

    <rect class="dg-box" x="30" y="250" width="120" height="56" rx="10"/>
    <text class="dg-t" x="44" y="274">Widget</text>
    <text class="dg-s" x="44" y="293">PrintTimer</text>

    <rect class="dg-box" x="160" y="250" width="120" height="56" rx="10"/>
    <text class="dg-t" x="174" y="274">PDF · CSV</text>
    <text class="dg-s" x="174" y="293">QuotePdf</text>

    <rect class="dg-box" x="300" y="250" width="120" height="56" rx="10"/>
    <text class="dg-t" x="314" y="274">Room</text>
    <text class="dg-s" x="314" y="293">DataStore</text>

    <rect class="dg-box" x="430" y="250" width="120" height="56" rx="10"/>
    <text class="dg-t" x="444" y="274">Importer</text>
