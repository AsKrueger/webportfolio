<svg class="dg" viewBox="0 0 820 460" role="img" aria-label="{{ t.diagram.cost_label }}" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="dg-arrow-3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path class="dg-head" d="M0 0L10 5L0 10z"/>
        </marker>
    </defs>

    <!-- Cliente Android -->
    <rect class="dg-box" x="10" y="60" width="170" height="84" rx="10"/>
    <text class="dg-t" x="24" y="88">Android</text>
    <text class="dg-s" x="24" y="108">Compose · MVVM</text>
    <text class="dg-s" x="24" y="124">Retrofit · AES-256</text>

    <!-- Backend -->
    <rect class="dg-group" x="240" y="20" width="380" height="262" rx="14"/>
    <text class="dg-label" x="256" y="44">Spring Boot 3.2 · Java 21</text>

    <rect class="dg-box" x="258" y="60" width="160" height="64" rx="10"/>
    <text class="dg-t" x="272" y="86">REST /api/v1</text>
    <text class="dg-s" x="272" y="106">ApiError · 4xx/5xx</text>

    <rect class="dg-box" x="440" y="60" width="160" height="64" rx="10"/>
    <text class="dg-t" x="454" y="86">Services</text>
