    <text class="dg-s" x="198" y="395">ARM64 image</text>

    <rect class="dg-box" x="346" y="350" width="140" height="60" rx="10"/>
    <text class="dg-t" x="358" y="376">EC2 t4g</text>
    <text class="dg-s" x="358" y="395">Docker · SSM</text>

    <rect class="dg-box" x="506" y="350" width="140" height="60" rx="10"/>
    <text class="dg-t" x="518" y="376">RDS</text>
    <text class="dg-s" x="518" y="395">PostgreSQL 16</text>

    <rect class="dg-box" x="666" y="350" width="128" height="60" rx="10"/>
