    <rect class="dg-group dg-group-pending" x="10" y="310" width="800" height="140" rx="14"/>
    <text class="dg-label" x="26" y="334">AWS · CloudFormation · GitHub Actions</text>
    <text class="dg-label dg-label-accent" x="794" y="334" text-anchor="end">{{ t.diagram.pending }}</text>

    <rect class="dg-box" x="26" y="350" width="140" height="60" rx="10"/>
    <text class="dg-t" x="38" y="376">GitHub Actions</text>
    <text class="dg-s" x="38" y="395">CI · OIDC</text>

    <rect class="dg-box" x="186" y="350" width="140" height="60" rx="10"/>
