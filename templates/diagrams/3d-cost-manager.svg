    <text class="dg-t" x="44" y="341">PvpcClient</text>
    <text class="dg-s" x="44" y="357">{{ t.diagram.pvpc }}</text>

    <path class="dg-line" d="M280 84H294" marker-end="url(#dg-arrow-3d)"/>
    <path class="dg-line" d="M380 112V128H155V140" marker-end="url(#dg-arrow-3d)"/>
    <path class="dg-line" d="M470 112V140" marker-end="url(#dg-arrow-3d)"/>
    <path class="dg-line" d="M360 202V244" marker-end="url(#dg-arrow-3d)"/>

    <!-- Fuera del móvil -->
    <rect class="dg-ext" x="600" y="250" width="210" height="56" rx="10"/>
    <text class="dg-t" x="614" y="274">{{ t.diagram.slicer }}</text>
    <text class="dg-s" x="614" y="293">Orca · Bambu · Prusa · Cura</text>
    <path class="dg-line" d="M600 278H556" marker-end="url(#dg-arrow-3d)"/>

    <rect class="dg-ext" x="600" y="316" width="210" height="56" rx="10"/>
    <text class="dg-t" x="614" y="340">REE · PVPC</text>
    <text class="dg-s" x="614" y="359">€/kWh</text>
    <path class="dg-line" d="M280 344H594" marker-end="url(#dg-arrow-3d)"/>

    <!-- Backend v1, archivado -->
    <rect class="dg-group dg-group-pending" x="600" y="20" width="210" height="182" rx="14"/>
    <text class="dg-label dg-label-accent" x="614" y="42">{{ t.diagram.archived }}</text>
    <rect class="dg-ext" x="614" y="58" width="182" height="72" rx="10"/>
    <text class="dg-t" x="628" y="82">Spring Boot 3</text>
    <text class="dg-s" x="628" y="101">PostgreSQL · JWT</text>
    <text class="dg-s" x="628" y="117">AWS CloudFormation</text>
    <text class="dg-note" x="705" y="160" text-anchor="middle">{{ t.diagram.archived_note }}</text>
    <text class="dg-note" x="705" y="178" text-anchor="middle">{{ t.diagram.archived_note2 }}</text>
