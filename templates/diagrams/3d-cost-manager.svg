    <path class="dg-line" d="M520 124V160" marker-end="url(#dg-arrow-3d)"/>
    <path class="dg-line" d="M600 92H644" marker-end="url(#dg-arrow-3d)"/>
    <path class="dg-line" d="M600 212H644" marker-end="url(#dg-arrow-3d)"/>

