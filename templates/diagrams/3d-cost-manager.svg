    <rect class="dg-ext" x="650" y="180" width="160" height="64" rx="10"/>
    <text class="dg-t" x="664" y="206">ESIOS API</text>
    <text class="dg-s" x="664" y="226">€/kWh</text>

    <path class="dg-line" d="M180 92H252" marker-end="url(#dg-arrow-3d)"/>
    <text class="dg-s" x="215" y="84" text-anchor="middle">JWT</text>
