<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ nombre }} | Junior Software Developer con orientación principal al backend en Java y Spring Boot.">
    <title>{% block title %}{{ nombre }} | {{ titulo }} | {{ subtitulo }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ site_root }}static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">
                <a href="{{ site_root }}">{{ nombre }}</a>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="{{ site_root }}">Inicio</a></li>
                <li><a href="{{ site_root }}sobre-mi/">Sobre mí</a></li>
                <li><a href="{{ site_root }}proyectos/">Proyectos</a></li>
                <li><a href="{{ site_root }}experiencia/">Experiencia</a></li>
                <li><a href="{{ site_root }}formacion/">Formación</a></li>
                <li><a href="{{ site_root }}contacto/">Contacto</a></li>
                <li><a href="{{ site_root }}curriculum.html">CV</a></li>
                {% if linkedin_url %}
                <li><a href="{{ linkedin_url }}" target="_blank" class="github-btn">LinkedIn</a></li>
                {% endif %}
                <li><a href="https://github.com/{{ github_user }}" target="_blank" class="github-btn">GitHub</a></li>
            </ul>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-dark">
        <div class="container footer-container">
            <div class="footer-copy">
                <p>&copy; 2026 Desarrollado por {{ nombre }}.</p>
            </div>
            <div class="footer-links">
                {% if linkedin_url %}<a href="{{ linkedin_url }}" target="_blank">LinkedIn</a> · {% endif %}
                <a href="https://github.com/{{ github_user }}" target="_blank">GitHub</a>
            </div>
        </div>
    </footer>
    <script src="{{ site_root }}static/js/main.js"></script>
</body>
</html>
