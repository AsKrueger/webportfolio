<!DOCTYPE html>
<!-- Plantilla de la imagen para redes sociales (1200×630).
     Regenerar: python tools/make_og.py  ->  static/img/og.png -->
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OG image</title>
<style>
    @font-face { font-family: "Inter"; src: url("../static/fonts/inter-latin.woff2") format("woff2"); font-weight: 400 800; }
    @font-face { font-family: "JetBrains Mono"; src: url("../static/fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 400 700; }
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
        position: relative;
        padding: 72px 80px;
        font-family: "Inter", sans-serif;
        color: #e8eaef;
        background:
            radial-gradient(55% 60% at 88% 0%, rgba(242, 165, 65, 0.22), transparent 70%),
            radial-gradient(45% 50% at 0% 100%, rgba(79, 209, 197, 0.14), transparent 70%),
            #0c0e12;
    }
    .grid {
        position: absolute; inset: 0;
        background: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.06) 1px, transparent 0) 0 0 / 28px 28px;
        mask-image: linear-gradient(90deg, transparent 30%, #000 100%);
    }
    .mark {
        display: inline-grid; place-items: center;
        width: 64px; height: 64px; border-radius: 16px;
        background: linear-gradient(135deg, #f2a541, #e0763a);
        color: #1a1206; font: 700 26px "JetBrains Mono", monospace;
    }
    .status {
        position: absolute; top: 84px; right: 80px;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 20px; border: 1px solid #2a303b; border-radius: 999px;
        background: rgba(20, 24, 31, 0.8);
        font-size: 22px; color: #e8eaef;
    }
    .status i { width: 12px; height: 12px; border-radius: 50%; background: #5ee08f; box-shadow: 0 0 0 6px rgba(94, 224, 143, 0.18); }
    h1 { margin-top: 56px; font-size: 84px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; color: #fff; }
    .role { margin-top: 22px; font-size: 38px; font-weight: 600; color: #9aa3b2; letter-spacing: -0.015em; }
    .role b { color: #f2a541; font-weight: 600; }
    .code {
        position: absolute; left: 80px; right: 80px; bottom: 64px;
        display: flex; justify-content: space-between; align-items: center;
        padding-top: 28px; border-top: 1px solid #262c37;
        font: 500 22px "JetBrains Mono", monospace; color: #6b7383;
    }
    .code .ok { color: #5ee08f; }
    .code .url { color: #e8eaef; }
    .chips { display: flex; gap: 10px; white-space: nowrap; }
    .code > span:first-child { white-space: nowrap; }
    .chips span { padding: 6px 14px; border: 1px solid #2a303b; border-radius: 8px; background: #14181f; color: #4fd1c5; font-size: 20px; }
</style>
</head>
<body>
    <div class="grid"></div>
    <span class="mark">AA</span>
    <p class="status"><i></i> Mérida · Remote · Available</p>
    <h1>Alonso Amador Sánchez</h1>
    <p class="role">Junior Software Developer · <b>Backend Java · Spring Boot</b></p>
    <div class="code">
        <span><span class="ok">200 OK</span> <span class="url">askrueger.github.io/webportfolio</span></span>
        <span class="chips"><span>Java 21</span><span>Spring Boot</span><span>PostgreSQL</span></span>
    </div>
</body>
</html>
